<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DayNightCycle, addWindowLights, createWindowLights } from './scripts/dayNight.js';
import { SURF, PLAIN, GRASS, createLook } from './lib/look.js';
import { planTown, DIRS, LEGEND } from './lib/townPlan.js';

// ?live draws the town in the window; without it the page renders images for sheet_server.py.
// ?seed= picks the town, ?size= the number of cells along a side (odd), ?warp=0 keeps streets straight.
const W = 1800, H = 1150, DEG = Math.PI / 180, M = 32;
const params = new URLSearchParams(location.search);
const LIVE = params.has('live');
const SEED = Number(params.get('seed')) || 1;
const WARP = params.get('warp') === '0' ? 0 : 0.3;

// ---------------------------------------------------------------- the plan
// Wave Function Collapse decides every cell (lib/townPlan.js). Each cell is 1 unit, 32 m.
const plan = planTown({ size: Number(params.get('size')) || 25, seed: SEED });
const N = plan.size, c = (N - 1) / 2;
const cellAt = (x, z) => (x < 0 || z < 0 || x >= N || z >= N ? null : plan.cells[z * N + x]);
const isRoad = (s) => s === 'r' || s === 'm';
const roadSides = (cell) => [0, 1, 2, 3].filter((d) => isRoad(cell.sides[d]));
const centreOf = (cell) => [cell.x - c, cell.z - c];
// Distance from the middle of town, 0 to 1, as the planner measures it
const zone = ([x, z]) => Math.min(1, Math.hypot(x, z) / (N / 2));
const DOWNTOWN = 0.42;

// ---------------------------------------------------------------- the warp
// The whole grid is bent by a smooth, gentle noise field, so streets curve a little while lots and
// buildings keep their shape. It fades out towards the edge of the map, so the edge stays square.
function hash(i, j) {
  let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(SEED, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash(i, j) + (hash(i + 1, j) - hash(i, j)) * u, b = hash(i, j + 1) + (hash(i + 1, j + 1) - hash(i, j + 1)) * u;

const fbm = (x, z) => 0.65 * vnoise(x, z) + 0.35 * vnoise(x * 2.1 + 5.2, z * 2.1 + 1.3);
function warp([x, z]) {

  const a = WARP * 2 * fade;

// ---------------------------------------------------------------- palette and looks
const tex = new THREE.TextureLoader();

const spec = tex.load('textures/specular.png'); spec.colorSpace = THREE.SRGBColorSpace; spec.flipY = false;

const SW = {
  ground: swatch(7, 4), park: swatch(4, 4), lawn: swatch(3, 4), asphalt: swatch(1, 2), pavement: swatch(4, 2),
  paving: swatch(5, 1), line: swatch(5, 3), white: swatch(1, 7), plinth: swatch(6, 2), plinthWarm: swatch(6, 1), kerb: swatch(5, 2),

const { groundMaterial, addBuildingDetail } = await createLook({
  material, M, seed: SEED,
  ground: ['flat', 'procedural', 'textures'].includes(params.get('ground')) ? params.get('ground') : 'textures',
  buildings: params.get('buildings') === 'flat' ? 'flat' : 'textures',
  textureScale: Number(params.get('texscale')) || 2.5,
});

// ---------------------------------------------------------------- flat geometry
const Y = { ground: 0, land: 0.004, path: 0.006, pavement: 0.007, road: 0.009, line: 0.011 };
const KERB = 0.03, INSET = 0.035, EDGE = 0.5 - INSET;
// Collects flat triangles, each with a palette swatch and a surface for the ground shader
function makeFlat() {
  const pos = [], uv = [], surf = [];

  const tri = (a, b, d, y, s, f = PLAIN) => {
    if ((b[1] - a[1]) * (d[0] - a[0]) - (b[0] - a[0]) * (d[1] - a[1]) < 0) [b, d] = [d, b];
    for (const p of [a, b, d]) { pos.push(p[0], y, p[1]); uv.push(...s); surf.push(...f); }
  };
  return {
    polygon(ring, y, s, f) {
      for (const [a, b, d] of THREE.ShapeUtils.triangulateShape(ring.map(([x, z]) => new THREE.Vector2(x, z)), [])) tri(ring[a], ring[b], ring[d], y, s, f);
    },
    // A strip along a line, slabs laid along each segment
    ribbon(pts, width, y, s, kind = SURF.none) {
      // Repeated points (where two curves meet) would read as a sharp corner and double the
      // strip's width there, so they're dropped
      pts = pts.filter((p, i) => i === 0 || Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) > 1e-6);
      if (pts.length < 2) return;
      const h = width / 2, L = [], R = [];
      const normal = (q0, q1) => { const [dx, dz] = norm(sub(q1, q0)); return [-dz, dx]; };
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i], a = pts[i - 1], b = pts[i + 1];
        let n;
        if (a && b) {
          const n1 = normal(a, p), n2 = normal(p, b);
          const [mx, mz] = norm([n1[0] + n2[0], n1[1] + n2[1]]);
          const k = 1 / Math.max(mx * n1[0] + mz * n1[1], 0.5);
          n = [mx * k, mz * k];
        } else n = a ? normal(a, p) : normal(p, b);
        L.push([p[0] + n[0] * h, p[1] + n[1] * h]); R.push([p[0] - n[0] * h, p[1] - n[1] * h]);
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const [dx, dz] = norm(sub(pts[i + 1], pts[i])), f = [kind, dx, dz];
        tri(L[i], R[i], L[i + 1], y, s, f); tri(R[i], R[i + 1], L[i + 1], y, s, f);
      }
    },
    disc(p, r, y, s, f = PLAIN, n = 16) {
      for (let k = 0; k < n; k++) {
        const a0 = (k / n) * Math.PI * 2, a1 = ((k + 1) / n) * Math.PI * 2;
        tri(p, [p[0] + Math.cos(a1) * r, p[1] + Math.sin(a1) * r], [p[0] + Math.cos(a0) * r, p[1] + Math.sin(a0) * r], y, s, f);
      }
    },
    mesh() {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
      g.setAttribute('surf', new THREE.Float32BufferAttribute(surf, 3));
      const m = new THREE.Mesh(g, groundMaterial); m.receiveShadow = true;
      return m;
    },
  };
}
// A cell's square (shrunk by inset), with its edges split so the warp can bend them
function cellRing(cell, inset = 0) {
  const [cx, cz] = centreOf(cell), h = 0.5 - inset, ring = [];
  const corners = [[-h, -h], [h, -h], [h, h], [-h, h]];
  for (let k = 0; k < 4; k++) {
    const a = corners[k], b = corners[(k + 1) % 4];
    for (let t = 0; t < 4; t++) ring.push(warp([cx + a[0] + (b[0] - a[0]) * t / 4, cz + a[1] + (b[1] - a[1]) * t / 4]));
  }
  return ring;
}
// A lot's raised base: its top in one swatch and surface, its kerb sides in grey
function plinth(cell, top, f) {
  const shape = new THREE.Shape(cellRing(cell, INSET).map(([x, z]) => new THREE.Vector2(x, -z)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: KERB, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  const nrm = g.attributes.normal, uv = g.attributes.uv, surf = new Float32Array(nrm.count * 3);
  for (let i = 0; i < nrm.count; i++) {
    const isTop = nrm.getY(i) > 0.5, s = isTop ? top : SW.kerb;
    uv.setXY(i, s[0], s[1]);
    if (isTop) surf.set(f, i * 3);
  }
  g.setAttribute('surf', new THREE.BufferAttribute(surf, 3));
  const m = new THREE.Mesh(g, groundMaterial); m.castShadow = true; m.receiveShadow = true;
  return m;
}

// ---------------------------------------------------------------- models
const loader = new GLTFLoader();
const cache = {};
async function model(name) {
  cache[name] ??= await new Promise((res, rej) => loader.load(`models/${name}.glb`, (g) => {
    g.scene.traverse((o) => { if (o.isMesh) { o.material = material; o.castShadow = true; o.receiveShadow = true; } });
    res(g.scene);
  }, undefined, rej));
  return cache[name].clone();
}
const sizes = {};
async function sizeOf(name) {           // footprint at scale 1, unrotated: [width along x, depth along z]
  if (!sizes[name]) { const m = await model(name); m.scale.setScalar(1 / 30); const s = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3()); sizes[name] = [s.x, s.z]; }
  return sizes[name];
}
const city = new THREE.Group();
// Each building gets its own copy of the palette material: its window lights and its look
function addLights(building) {
  const own = material.clone();
  addWindowLights(own, createWindowLights());
  addBuildingDetail(own);
  building.traverse((o) => { if (o.isMesh) o.material = own; });
}
// Place a model centred on (x, z), standing on y, facing `rot` radians (its front is +z at 0)
async function place(name, [x, z], { rot = 0, s = 1, y = 0, parent = city, building = false } = {}) {
  const m = await model(name);
  m.scale.setScalar(s / 30);
  m.rotation.y = rot;
  const box = new THREE.Box3().setFromObject(m), ctr = box.getCenter(new THREE.Vector3());
  m.position.set(x - ctr.x, y - box.min.y, z - ctr.z);
  if (building) addLights(m);
  parent.add(m);
  return m;
}

let seed = SEED * 9301 + 49297;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = (list) => list[Math.floor(rand() * list.length)];
const shuffle = (list) => list.map((v) => [rand(), v]).sort((a, b) => a[0] - b[0]).map(([, v]) => v);

const SHOPFRONTS = ['building-block-4floor-short', 'building-block-5floor-short', 'building-block-4floor-front', 'building-block-5floor-front', 'building-cafe', 'building-restaurant', 'building-post', 'building-cinema', 'building-block-5floor'];
const CORNERS = ['building-block-4floor-corner', 'building-block-5floor-corner'];
const FLATS = ['building-block-4floor-short', 'building-block-5floor-short', 'building-block-4floor-front', 'building-block-5floor-front', 'building-house-block-big'];
const FAMILY = ['building-house-family-small', 'building-house-family-large', 'building-house-modern', 'building-house-modern-big', 'building-cabin-big'];
const TOWNHOUSES = ['building-house-block', 'building-house-block-old', 'building-house-block-big', 'building-house-block', 'building-house-block-old'];
const CIVIC = { 'town-hall': 'building-museum', bank: 'building-bank', school: 'building-school', 'fire-station': 'building-firestation', police: 'building-policestation', hospital: 'building-hospital', 'data-centre': 'data-center' };
const TREES = ['tree-oak', 'tree-lime', 'tree-round', 'tree-birch', 'tree-elipse', 'tree-beech'];
const CONIFERS = ['tree-fir', 'tree-spruce', 'tree-conifer'];
const CARS = ['car-passenger', 'car-taxi', 'car-hippie-van', 'car-veteran', 'car-passenger-race', 'truck', 'car-police'];

// ---------------------------------------------------------------- streets
// Streets are traced through the plan from junction to junction, bending round corners, then
// drawn as ribbons along the warped line. A junction is any road cell that isn't a plain
// straight or bend; those get a round patch of road.
const ROAD = { r: { road: 0.3, pavement: 0.46 }, m: { road: 0.44, pavement: 0.62 } };
const isNode = (cell) => roadSides(cell).length !== 2;
const streets = [];
{
  const done = new Set();
  const mark = (cell, d) => done.add(`${cell.x},${cell.z},${d}`);
  const seen = (cell, d) => done.has(`${cell.x},${cell.z},${d}`);
  function trace(start, d0) {
    const cls = start.sides[d0], pts = [centreOf(start)];
    let cell = start, d = d0, endNode = true;
    mark(cell, d);
    for (;;) {
      const next = cellAt(cell.x + DIRS[d][0], cell.z + DIRS[d][1]);
      if (!next) { const [x, z] = centreOf(cell); pts.push([x + DIRS[d][0] * 0.5, z + DIRS[d][1] * 0.5]); endNode = false; break; }
      const back = (d + 2) % 4;
      mark(next, back);
      if (isNode(next) || next === start) { pts.push(centreOf(next)); break; }
      const out = roadSides(next).find((s) => s !== back);
      const [x, z] = centreOf(next);
      if (out === d) pts.push([x, z]);
      else {
        // A bend: a quarter circle round the corner of the cell between the two sides
        const A = [x + DIRS[back][0] * 0.5, z + DIRS[back][1] * 0.5], B = [x + DIRS[out][0] * 0.5, z + DIRS[out][1] * 0.5];
        const O = [x + (DIRS[back][0] + DIRS[out][0]) * 0.5, z + (DIRS[back][1] + DIRS[out][1]) * 0.5];
        const a0 = Math.atan2(A[1] - O[1], A[0] - O[0]);
        let a1 = Math.atan2(B[1] - O[1], B[0] - O[0]);
        if (a1 - a0 > Math.PI) a1 -= 2 * Math.PI; else if (a0 - a1 > Math.PI) a1 += 2 * Math.PI;
        for (let k = 0; k <= 6; k++) { const a = a0 + (a1 - a0) * k / 6; pts.push([O[0] + Math.cos(a) * 0.5, O[1] + Math.sin(a) * 0.5]); }
      }
      mark(next, out);
      cell = next; d = out;
    }
    // Split into short steps so the warp bends them smoothly, then warp
    const dense = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const steps = Math.max(1, Math.ceil(Math.hypot(...sub(pts[i + 1], pts[i])) / 0.2));
      for (let k = 0; k < steps; k++) dense.push([pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k / steps, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k / steps]);
    }
    dense.push(pts.at(-1));
    const mid = pts[Math.floor(pts.length / 2)];
    const downtown = zone(mid) < DOWNTOWN;
    // plan: the line before the warp, for working out where park paths meet the street
    streets.push({ cls, plan: dense, pts: dense.map(warp), startNode: true, endNode, downtown, ...ROAD[cls], pavement: downtown ? 0.9 : ROAD[cls].pavement });
  }
  const roadCells = plan.cells.filter((cell) => roadSides(cell).length);
  for (const cell of roadCells) if (isNode(cell)) for (const d of roadSides(cell)) if (!seen(cell, d)) trace(cell, d);

  for (const cell of roadCells) for (const d of roadSides(cell)) if (!seen(cell, d)) trace(cell, d);
}
// Points every `step` along a street, as [point, tangent], keeping `trim` clear of its junction ends
function along(street, step, trim = 0.42) {
  const { pts } = street, cum = [0], out = [];

// ---------------------------------------------------------------- the ground, parks and roads
const ground = makeFlat();
const half = N / 2;
ground.polygon([[-half, -half], [half, -half], [half, half], [-half, half]], Y.ground, SW.ground, GRASS);
for (const cell of plan.cells) if (cell.id === 'park' || cell.id === 'square') ground.polygon(cellRing(cell), Y.land, SW.park, GRASS);

// ---------------------------------------------------------------- park paths
// Paths go where people would walk. Each park (a group of park cells side by side) gets
// entrances only where a street runs along its edge, then a path from each entrance to a hub
// near its middle:
// - 2 entrances: one path through the park, from street to street, with a bench beside it
// - 1, or 3 and more: paths meet at a small round seating area with benches
// - none: no paths
// The courthouse square gets paths in from the middle of each side and from each corner, to
// the fountain. Paths run straight where they can, and curve round corners where they can't.
// Everything is worked out on the plan, then warped like the streets.
const parkPaths = [];             // the paths as drawn (warped), so trees keep off them
const plazas = [];                // seating areas: { o, r }, warped
const parkBenches = new Map();    // cell index → benches to place: [{ p, rot }]
{
  const segDist = (p, a, b) => {

    return Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dz * t);
  };

    st.box = st.plan.reduce((b, [x, z]) => [Math.min(b[0], x), Math.min(b[1], z), Math.max(b[2], x), Math.max(b[3], z)], [Infinity, Infinity, -Infinity, -Infinity]);
  }
  // Whether a plan point is on a street's pavement or road
  const onStreet = (p) => streets.some((st) => {
    if (p[0] < st.box[0] - 1 || p[1] < st.box[1] - 1 || p[0] > st.box[2] + 1 || p[1] > st.box[3] + 1) return false;
    for (let i = 0; i < st.plan.length - 1; i++) if (segDist(p, st.plan[i], st.plan[i + 1]) < st.pavement / 2 - 0.02) return true;
    return false;

  function reachStreet(p, dir, max) {
    for (let t = 0; t <= max; t += 0.02) {

  }

      const out = [pts[0]];

        const a = pts[i], b = pts[i + 1];
        if (i > 0) out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
        if (i < pts.length - 2) out.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);

      out.push(pts.at(-1));

    }

  for (const cell of plan.cells) {
    if (cell.order > upTo) continue;
    ctx.fillStyle = COLOURS[cell.char] ?? '#888';
    ctx.fillRect(cell.x * k, cell.z * k, k, k);
    if (cell.kind === 'lot' && cell.sides.includes('f')) {
      ctx.fillStyle = '#00000088';
      cell.sides.forEach((s, d) => {
        if (s !== 'f') return;
        const [dx, dz] = DIRS[d];
        ctx.fillRect(cell.x * k + (dx > 0 ? k - 2 : 0), cell.z * k + (dz > 0 ? k - 2 : 0), dx ? 2 : k, dz ? 2 : k);
      });
    }
  }
}

// ---------------------------------------------------------------- rendering
function camera(centre, halfView, aspect) {
  const cam = new THREE.OrthographicCamera(-halfView * aspect, halfView * aspect, halfView, -halfView, 1, 1000);
  cam.position.set(centre.x + 100 * Math.sin(225 * DEG) * Math.cos(45 * DEG), 100 * Math.sin(45 * DEG), centre.z + 100 * Math.cos(225 * DEG) * Math.cos(45 * DEG));
  cam.lookAt(centre);
  return cam;
}
async function post(body, name) { await fetch(`save?name=${name}`, { method: 'POST', body }); }
const png = (canvas) => new Promise((r) => canvas.toBlob(r, 'image/png'));

if (LIVE) {
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const view = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  view.setPixelRatio(Math.min(devicePixelRatio, 2));
  view.setSize(innerWidth, innerHeight);
  view.setClearColor(0x000000, 0);
  view.shadowMap.enabled = true; view.shadowMap.type = THREE.PCFShadowMap; view.shadowMap.autoUpdate = false;
  document.body.appendChild(view.domElement);
  const scene = new THREE.Scene(); scene.add(city);
  const centre = new THREE.Vector3(0, 0, 0), halfView = N * 0.62;
  const cycle = new DayNightCycle(scene, centre, N * 0.8);
  cycle.keyLight.shadow.mapSize.set(4096, 4096);
  cycle.time = 0.35; cycle.update(0);
  const cam = camera(centre, halfView, innerWidth / innerHeight);
  const controls = new OrbitControls(cam, view.domElement);
  controls.target.copy(centre);
  controls.minPolarAngle = controls.maxPolarAngle = 45 * DEG;
  controls.minZoom = 0.8; controls.maxZoom = 16;
  controls.screenSpacePanning = false;
  controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
  controls.update();
  let dirty = true;
  controls.addEventListener('change', () => { dirty = true; });
  addEventListener('resize', () => { const a = innerWidth / innerHeight; Object.assign(cam, { left: -halfView * a, right: halfView * a }); cam.updateProjectionMatrix(); view.setSize(innerWidth, innerHeight); dirty = true; });

  // Panel: seed, new town, replay, and the time of day
  const go = (changes) => { const p = new URLSearchParams(location.search); for (const [k, v] of Object.entries(changes)) p.set(k, v); location.search = p; };
  document.getElementById('seedLabel').textContent = `seed ${SEED} · ${N}×${N} cells · solved in ${plan.tries} ${plan.tries === 1 ? 'try' : 'tries'}`;
  document.getElementById('new').onclick = () => go({ seed: 1 + Math.floor(Math.random() * 9999) });
  let playing = false;
  const playButton = document.getElementById('play'), slider = document.getElementById('time'), phase = document.getElementById('phase');
  playButton.onclick = () => { playing = !playing; playButton.textContent = playing ? 'Pause' : 'Play'; };
  slider.oninput = () => { cycle.time = slider.value / 1000; cycle.update(0); dirty = true; };
  const mapCanvas = document.getElementById('map');
  document.getElementById('mapNote').textContent = 'The plan the solver made. Dark ticks mark which way each lot faces.';
  document.getElementById('panel').hidden = false;
  document.getElementById('mapCard').hidden = false;

  // Watch it build: lots rise in the order the solver decided them
  const BUILD = 6;
  let buildStart = performance.now();
  const steps = plan.cells.length;
  document.getElementById('replay').onclick = () => { buildStart = performance.now(); };

  const clock = new THREE.Clock();
  let shadowTime = -1;
  view.setAnimationLoop((now) => {
    const dt = Math.min(clock.getDelta(), 0.1);
    if (playing) { cycle.update(dt); slider.value = Math.round(cycle.time * 1000); dirty = true; }
    if (phase.textContent !== cycle.phase) phase.textContent = cycle.phase;
    const t = (now - buildStart) / 1000, building = t < BUILD + 0.5;
    if (building) {
      const upTo = (t / BUILD) * steps;
      for (const g of cellGroups) {
        const k = Math.min(1, Math.max(0, (upTo - g.userData.order) / (steps * 0.04)));
        g.visible = k > 0;
        g.scale.y = Math.max(0.001, 1 - (1 - k) ** 3);
      }
      drawMap(mapCanvas, upTo);
      dirty = true;
    }
    if (!dirty) return;
    if (building || Math.abs(cycle.time - shadowTime) > 0.001) { view.shadowMap.needsUpdate = true; shadowTime = cycle.time; }
    document.body.style.background = `linear-gradient(0deg, #${cycle.skyBottom.getHexString()}, #${cycle.skyTop.getHexString()})`;
    view.render(scene, cam);
    dirty = false;
  });
  window.town = { plan, cycle };
  document.getElementById('loading').remove();
} else {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
  renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
  const shot = async (centre, halfView, name) => {
    const scene = new THREE.Scene(); scene.add(city);
    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.copy(centre).add(new THREE.Vector3(-10, 20, 0).multiplyScalar(Math.max(1, halfView / 6)));
    sun.target.position.copy(centre);
    sun.castShadow = true;
    const s = halfView * 1.8;
    Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: 500 });
    sun.shadow.mapSize.set(4096, 4096); sun.shadow.normalBias = 0.01;
    scene.add(sun, sun.target, new THREE.AmbientLight(0xffffff, 0.5));
    renderer.render(scene, camera(centre, halfView, W / H));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const grad = ctx.createLinearGradient(0, H, 0, 0); grad.addColorStop(0, '#3a5177'); grad.addColorStop(1, '#81b1e0');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H); ctx.drawImage(renderer.domElement, 0, 0);
    await post(await png(cv), name);
  };
  if (params.has('shot')) {
    // ?shot=x,z,half renders just one view, centred on plan cell (x, z), half the view's height across
    const [x, z, h] = params.get('shot').split(',').map(Number);
    const [wx, wz] = warp([x - c, z - c]);
    await shot(new THREE.Vector3(wx, 0, wz), h || 1.5, 'town-shot');
  } else {
    const mapCanvas = document.createElement('canvas'); mapCanvas.width = mapCanvas.height = N * 16;
    drawMap(mapCanvas);
    await post(await png(mapCanvas), 'town-map');
    await post(`${plan.map}\n\nseed ${SEED}, solved in ${plan.tries} tries\n${LEGEND}\n`, 'town-map.txt');
    await shot(new THREE.Vector3(0, 0, 0), N * 0.6, 'town-whole');
    await shot(new THREE.Vector3(0, 0, 0), 4.6, 'town-square');
    await shot(new THREE.Vector3(N * 0.22, 0, N * 0.22), 5, 'town-neighbourhood');
    await shot(new THREE.Vector3(-2.5, 0, 1.5), 2, 'town-closeup');
  }
}
document.title = 'done';
</script>
</body>
</html>
